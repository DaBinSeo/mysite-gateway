upstream api_v1     { server host.docker.internal:8000; }   # API v1 서버
upstream django_web { server host.docker.internal:8000; }   # 장고 관리자 화면·관리자용 정적 파일
upstream frontend   { server host.docker.internal:5173; }   # Vite 개발 서버

# 회원가입: IP당 1분에 1번(burst 5: 처음 6번까지는 바로 허용). 계정 대량 생성을 막는다 (운영 nginx와 같은 값)
limit_req_zone $binary_remote_addr zone=signup:1m rate=1r/m;

server {
    listen 80;
    charset utf-8;
    server_tokens off;  # Server 헤더·오류 페이지에 nginx 버전을 노출하지 않는다

    # 장고로 보내는 요청에 공통으로 붙이는 헤더
    proxy_set_header Host $http_host;        # localhost:8080 그대로 전달 → ALLOWED_HOSTS·CSRF Origin 검사 통과
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/v1/auth/signup/ {
        limit_req zone=signup burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_requests;
        proxy_pass http://api_v1;
    }

    location @too_many_requests {
        default_type application/json;
        return 429 '{"detail": "요청이 너무 많습니다. 잠시 후 다시 시도해 주세요."}';
    }

    # API v1 (새 버전은 upstream api_v2 + location ^~ /api/v2/ 추가)
    location ^~ /api/v1/ {
        proxy_pass http://api_v1;
    }

    # 등록되지 않은 API 버전은 게이트웨이에서 바로 404
    location ^~ /api/ {
        default_type application/json;
        return 404 '{"detail": "지원하지 않는 API 버전입니다."}';
    }

    # 장고 관리자 화면 (/static/은 관리자 화면의 CSS·JS)
    location ~ ^/(admin|static)/ {
        proxy_pass http://django_web;
    }

    # 검색엔진용 사이트맵은 장고가 질문 목록으로 만든다 (robots.txt는 프런트 public/ 정적 파일)
    location = /sitemap.xml {
        proxy_pass http://django_web;
    }

    # 나머지 화면은 모두 React(Vite) 개발 서버, HMR 웹소켓 포함
    # (Vite는 모르는 경로에 index.html을 돌려주므로 /questions/1 같은 주소에서 새로고침해도 된다)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }
}
